<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Restablecer contraseña</title>
</head>
<body style="font-family:sans-serif;max-width:360px;margin:40px auto">
    <h2>Restablecer contraseña</h2>
    <input id="p1" type="password" placeholder="Nueva contraseña" style="width:100%;margin:6px 0"><br>
    <input id="p2" type="password" placeholder="Confirmar contraseña" style="width:100%;margin:6px 0"><br>
    <button onclick="enviar()">Cambiar contraseña</button>
    <p id="msg"></p>
    <script>
    const q = new URLSearchParams(location.search);
    async function enviar() {
      const r = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          correo: q.get('correo'),
          token: q.get('token'),
          nuevaPassword: document.getElementById('p1').value,
          confirmarPassword: document.getElementById('p2').value
        })
      });
      const d = await r.json().catch(() => ({}));
      document.getElementById('msg').textContent =
        r.ok ? d.mensaje : (d.mensaje || (d.errores || ['Datos inválidos.']).join(' '));
    }
    </script>
</body>
</html>
